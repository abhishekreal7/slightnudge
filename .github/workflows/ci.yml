name: SlightNudge CI

on:
  push:
    branches: [ main, 'feat/*', 'fix/*', 'design/*', 'stage/*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run Unit & Security Tests
        run: npm test

      - name: Run Geometry UI Integration Tests
        run: npx tsx test/geometry-ui-integration.test.ts

      - name: Run Visual Studio Upgrade Tests
        run: npx tsx test/duplicate-delete-wrap.test.ts

      - name: Production Build (Offline font resilience)
        run: npm run build:offline
